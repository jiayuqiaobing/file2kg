[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "file2kg"
version = "0.1.0"
description = "文件 → 知识库摄取管道：本地增量摄取、混合检索（RAG 全链路最上游的一步）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["rag", "embedding", "lancedb", "files-to-knowledge", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "lancedb>=0.9",
    "pyarrow>=14.0",
    "sentence-transformers>=3.4",
    "transformers>=4.52",          # Qwen3-Embedding 需要的新版 transformers（<4.51 报错）
    "openai>=1.30",                # API 模式（函数内延迟导入）
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
file2kg = "file2kg.cli:app"  # console 入口：typer app 即 callable

[tool.hatch.build.targets.wheel]
packages = ["src/file2kg"]
