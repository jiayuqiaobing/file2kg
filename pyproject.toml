[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "file2kg"
version = "0.2.0"
description = "文件 → 知识库摄取管道：本地增量摄取、混合检索（RAG 全链路最上游的一步）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["rag", "embedding", "lancedb", "files-to-knowledge", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "lancedb>=0.9",
    "pyarrow>=14.0",
    "sentence-transformers>=3.4",
    "transformers>=4.52",          # Qwen3-Embedding 需要的新版 transformers（<4.51 报错）
    "openai>=1.30",                # API 模式（函数内延迟导入）
]

[project.optional-dependencies]
# serve：常驻服务（HTTP API + MCP）。刻意不做核心依赖——fastmcp 实测带入 68 个包，
# 让只用 ingest/query 的用户背这些与"装完即用"冲突（宪法原则 I / II）。
# starlette 与 uvicorn 已在 fastmcp 依赖树内，此处属显式声明而非新增下载。
serve = [
    "fastmcp>=4.0,<5",
    "starlette>=1.0.1",
    "uvicorn>=0.35",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",       # starlette TestClient 依赖；本项目里它只是 huggingface-hub 的传递依赖，
                         # 显式声明以免上游松手时测试莫名其妙崩（smoke U5 实测发现）
    "file2kg[serve]",    # 测试需要 serve 依赖
]

[project.scripts]
file2kg = "file2kg.cli:app"  # console 入口：typer app 即 callable

[tool.hatch.build.targets.wheel]
packages = ["src/file2kg"]
